<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | inLine Orthodontics</title>
  <link rel="canonical" href="https://www.inlineortho.com/404.html">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/responsive.css">
  <style>
    .error-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: var(--space-xl);
      background: linear-gradient(160deg, var(--color-bg) 0%, var(--color-bg-warm) 100%);
    }
    .error-page__code {
      font-family: var(--font-heading);
      font-size: clamp(5rem, 15vw, 10rem);
      font-weight: 800;
      background: linear-gradient(135deg, var(--color-primary), var(--color-secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      margin-bottom: var(--space-md);
    }
    .error-page h2 {
      margin-bottom: var(--space-md);
    }
    .error-page p {
      color: var(--color-text-light);
      font-size: var(--font-size-lg);
      margin-bottom: var(--space-xl);
      max-width: 480px;
      margin-left: auto;
      margin-right: auto;
    }
    .error-page__actions {
      display: flex;
      gap: var(--space-md);
      justify-content: center;
      flex-wrap: wrap;
    }
  </style>
  <!-- Google Analytics (consent-gated) -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('consent', 'default', {'analytics_storage': 'denied'});
  </script>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-VXB0T5QNHH"></script>
  <script>
    if(localStorage.getItem('cookie_consent') === 'accepted') {
      gtag('consent', 'update', {'analytics_storage': 'granted'});
      gtag('config', 'G-VXB0T5QNHH');
    }
  </script>
</head>
<body>
  <div id="cookie-banner" style="display:none; position:fixed; bottom:0; left:0; right:0; background:#1a1a1a; color:#fff; padding:16px 24px; z-index:9999; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; font-family:sans-serif; font-size:14px;">
    <p style="margin:0; max-width:700px;">
      We use cookies to analyze website traffic. By clicking "Accept," you consent to our use of Google Analytics.
    </p>
    <div style="display:flex; gap:12px; flex-shrink:0;">
      <button onclick="setCookieConsent('declined')" style="padding:8px 20px; background:transparent; color:#fff; border:1px solid #fff; border-radius:20px; cursor:pointer; font-size:14px;">
        Decline
      </button>
      <button onclick="setCookieConsent('accepted')" style="padding:8px 20px; background:#00AB89; color:#fff; border:none; border-radius:20px; cursor:pointer; font-size:14px;">
        Accept
      </button>
    </div>
  </div>
  <script>
    function setCookieConsent(choice) {
      localStorage.setItem('cookie_consent', choice);
      document.getElementById('cookie-banner').style.display = 'none';
      if(choice === 'accepted') {
        gtag('consent', 'update', {'analytics_storage': 'granted'});
        gtag('config', 'G-VXB0T5QNHH');
      }
    }
    if(!localStorage.getItem('cookie_consent')) {
      document.getElementById('cookie-banner').style.display = 'flex';
    }
  </script>
  <div class="error-page">
    <div>
      <div class="error-page__code">404</div>
      <h2>This page has moved</h2>
      <p>We recently updated our website and this page may have a new address. Let us help you find what you're looking for.</p>
      <div class="error-page__actions">
        <a href="/" class="btn btn--primary btn--lg">Go Home</a>
        <a href="/contact/appointment.html" class="btn btn--outline btn--lg">Schedule Appointment</a>
      </div>
    </div>
  </div>
</body>
</html>
